<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Hora do Sol</title>
<link rel="manifest" href="manifest.webmanifest?v=5">
<meta name="theme-color" content="#03050c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hora do Sol">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--serif:"Cinzel","Trajan Pro",Georgia,serif;--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#03050c;--ink:#eef1f8;--soft:#9ba5c0;--line:rgba(255,255,255,.1);--card:rgba(12,18,38,.58);--card-strong:rgba(10,15,32,.86);
  --gold:#f3c969;--gold2:#c98a2e;--accent:#8fb4ff;--lcd:#ff3b30;--lcd-glow:rgba(255,59,48,.75);--nav-h:66px;
  box-sizing:border-box;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
body[data-lcd="ambar"]{--lcd:#ffb300;--lcd-glow:rgba(255,179,0,.7)}
body[data-lcd="verde"]{--lcd:#3dff8f;--lcd-glow:rgba(61,255,143,.6)}
body[data-lcd="azul"]{--lcd:#4fc8ff;--lcd-glow:rgba(79,200,255,.7)}
body[data-theme="claro"]{--bg:#e9eef6;--ink:#13203a;--soft:#51607d;--line:rgba(19,32,58,.14);--card:rgba(255,255,255,.78);--card-strong:#fff;--gold:#b7791f;--gold2:#8a560c;--accent:#2f5fc4;color-scheme:light}
#space{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
body[data-theme="claro"] #space,body[data-theme="claro"] .twinkles{display:none}
body[data-theme="claro"]{background:linear-gradient(180deg,#cfe0f5,#eef2f8 40%,#f5f3ee)}
.twinkles{position:fixed;inset:0;z-index:-1;pointer-events:none}
.twinkles i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.8);animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* Topo */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:9px;font:600 13px var(--serif);letter-spacing:2.5px;color:var(--ink);text-decoration:none;margin-right:auto}
.brand .sunmark{width:26px;height:26px}
.brand small{font:500 10px var(--sans);letter-spacing:0;border:1px solid var(--line);padding:2px 6px;border-radius:5px;color:var(--soft)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:42px;height:42px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:600 12px var(--sans)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.active{border-color:var(--gold);color:var(--gold)}

/* Herói */
.hero{position:relative;padding:18px 0 8px;overflow:visible}
.sun-glow{position:absolute;right:-90px;top:-70px;width:260px;height:260px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fffbe6 0 9%,#ffe08a 16%,rgba(255,190,70,.55) 28%,rgba(255,150,40,.16) 48%,rgba(255,120,30,0) 70%);transition:opacity 1s,transform 1s;z-index:0}
.moon-deco{position:absolute;left:auto;right:150px;top:4px;width:40px;height:40px;z-index:0;border-radius:50%}
.moon-deco img{position:absolute;inset:0;width:100%;height:100%;display:block}
body[data-theme="claro"] .sun-glow{opacity:.55}
.hero>*:not(.sun-glow):not(.moon-deco){position:relative;z-index:1}
.place{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.loc-pill{position:relative;display:inline-flex;font-family:var(--serif);align-items:center;gap:8px;padding:7px 14px 7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--card);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;font:600 22px var(--serif);color:var(--ink)}
.loc-pill .pin{width:20px;height:20px;color:var(--gold);flex:none}
.loc-pill .chev{width:20px;height:20px;color:var(--gold);flex:none}
.loc-pill:hover,.loc-pill:focus-within{border-color:var(--gold)}
.loc-hint{font-size:11px;color:var(--soft);margin:6px 0 0 4px}
.date{font-size:13px;color:var(--soft);line-height:1.5}
.world-title{font:600 26px var(--serif);margin:0}
.world-site{font-size:13px;color:var(--soft);margin-top:2px}
.world-back{margin-top:10px}
.eyebrow{font:600 11px var(--sans);letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
.hero .eyebrow{margin-top:22px;display:flex;align-items:center;gap:8px}
.solar{font-family:var(--serif);font-weight:700;font-size:calc(clamp(64px,20vw,112px)*var(--clock-scale,1));line-height:1.02;letter-spacing:1px;white-space:nowrap;margin:6px 0 2px;
  background:linear-gradient(180deg,#fff6d8 0%,#ffe08f 38%,#f3b64a 70%,#c98a2e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(243,190,90,.35));font-variant-numeric:lining-nums tabular-nums}
.solar .sec{font-size:.42em;letter-spacing:0;margin-left:4px;vertical-align:.95em}
body[data-theme="claro"] .solar{background:linear-gradient(180deg,#c98a2e,#8a560c);-webkit-background-clip:text;background-clip:text;filter:none}
.lcd-block{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.lcd{display:inline-flex;align-items:center;padding:10px 14px;border-radius:12px;background:linear-gradient(180deg,#0b0d12,#050608);border:1px solid rgba(255,255,255,.09);box-shadow:inset 0 2px 12px rgba(0,0,0,.9),0 8px 24px rgba(0,0,0,.35)}
.lcd svg{display:block;height:calc(clamp(36px,10vw,52px)*var(--clock-scale,1));width:auto;overflow:visible}
.lcd .on{fill:var(--lcd);filter:drop-shadow(0 0 4px var(--lcd-glow))}
.lcd .off{fill:var(--lcd);opacity:.07}
.lcd-label{font:600 11px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--soft);line-height:1.5}
.lcd-label b{display:block;color:var(--ink);font-weight:600;letter-spacing:.5px;text-transform:none;font-size:13px}
.sentence{font-size:16px;line-height:1.55;margin:16px 0 0;max-width:38ch}
.sentence strong{color:var(--gold);font-weight:600}
.hero-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.chipbtn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:38px;font:500 13px var(--sans);cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.chipbtn svg{width:16px;height:16px}
.hero-visual{margin-top:16px}
.hero-visual:empty{display:none}
.hero-visual svg{display:block;width:min(100%,330px);height:auto}

/* Cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin:14px 0;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.card h2,.section-title{font:600 20px var(--serif);margin:0;letter-spacing:.5px}
.card .sub{font-size:13px;color:var(--soft);margin:4px 0 0;line-height:1.5}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pill{font-size:11px;border:1px solid var(--line);padding:4px 9px;border-radius:999px;color:var(--soft);white-space:nowrap}
.arc{display:block;width:100%;height:auto;margin:10px 0 2px;overflow:visible}
.arc text{font:10px var(--sans);fill:var(--soft)}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.18;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}
.events{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.events>div:nth-child(2){text-align:center}.events>div:last-child{text-align:right}
.events span{display:block;font-size:11px;color:var(--soft)}
.events b{display:block;font:700 22px var(--serif);margin-top:4px;font-variant-numeric:lining-nums tabular-nums}
.events .noon b{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat b{display:block;font:700 18px var(--serif);font-variant-numeric:lining-nums tabular-nums;line-height:1.25}
.stat span{display:block;font-size:11.5px;color:var(--soft);line-height:1.4;margin-top:3px}
.teaser{display:flex;align-items:center;gap:14px;cursor:pointer;width:100%;text-align:left;color:inherit;font:inherit}
.planet-dot{flex:none;width:34px;height:34px;border-radius:50%;box-shadow:inset -7px -5px 12px rgba(0,0,0,.55),0 0 14px rgba(255,255,255,.08)}
.teaser .t-main{flex:1;min-width:0}
.teaser .t-time{font:700 28px var(--serif);color:var(--gold);font-variant-numeric:lining-nums tabular-nums}

/* Explorar */
.inputs{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:12px}
.inputs label{display:grid;gap:5px;font-size:11px;color:var(--soft)}
.inputs input,.field input,.field select{font:14px var(--sans);min-height:42px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:10px;color:var(--ink);padding:8px 10px}
body[data-theme="claro"] .inputs input,body[data-theme="claro"] .field input,body[data-theme="claro"] .field select{background:#fff}
.btn{min-height:42px;border:0;border-radius:10px;padding:9px 16px;background:var(--gold);color:#1b1305;font:700 13px var(--sans);cursor:pointer}
input[type=range]{width:100%;margin:18px 0 4px;accent-color:var(--gold)}
.range-scale{display:flex;justify-content:space-between;font-size:10px;color:var(--soft)}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--soft)}
.dot{width:7px;height:7px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84}
.status.paused .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
#timeNote:empty{display:none}
.muted{font-size:12px;color:var(--soft);line-height:1.6}

/* Linhas e painéis */
details.card{padding:0}
details.card>summary{list-style:none;cursor:pointer;padding:16px 44px 16px 18px;position:relative;font-weight:600;font-size:14px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'+';position:absolute;right:18px;top:12px;font-size:22px;color:var(--gold);font-weight:400}
details.card[open]>summary::after{content:'−'}
details.card>summary span{display:block;font-size:12px;font-weight:400;color:var(--soft);margin-top:3px}
.detail-body{padding:0 18px 18px}
.rows{margin:0}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.rows .row:first-child{border-top:0}
.row .k small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.row .v{font-variant-numeric:tabular-nums;text-align:right}
.row.key .k,.row.key .v{font-weight:700}
.row.past{opacity:.5}
.row.now{border-top:2px solid var(--gold)}.row.now .k{color:var(--gold);font-weight:600}
.row.total{border-top:1.5px solid var(--ink);font-weight:700}
.chart{width:100%;height:auto;display:block;color:var(--ink)}
.lede{font-size:14px;color:var(--soft);line-height:1.55;margin:0 0 12px}
.moon-head{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.moon-head svg{width:84px;height:84px;flex:none}
.moon-name{font:600 22px var(--serif)}
.moon-sub{font-size:13px;color:var(--soft);margin-top:3px}
.dial-wrap{display:flex;justify-content:center}
.dial{width:min(100%,320px);height:auto}

/* Planetas, céu, sistema, mundos */
.view{display:none}.view.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-head{padding:22px 0 4px}
.view-head h1{font:600 26px var(--serif);margin:6px 0 0;letter-spacing:.5px}
.view-head p{font-size:14px;color:var(--soft);margin:6px 0 0;line-height:1.55}
.pl{display:flex;gap:14px;align-items:flex-start}
.pl .planet-dot{width:40px;height:40px;margin-top:2px}
.pl-main{flex:1;min-width:0}
.pl-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pl-name b{font:600 19px var(--serif)}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.badge.yes{border-color:rgba(61,220,132,.5);color:#6ff0a5}
body[data-theme="claro"] .badge.yes{color:#157a3f}
.pl-line{font-size:13.5px;line-height:1.55;margin-top:5px}
.pl-line.soft{color:var(--soft)}
.skymap{display:block;width:100%;max-width:460px;margin:6px auto 0;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.orbit-svg{display:block;width:100%;max-width:460px;margin:0 auto;height:auto}
.worlds{display:grid;gap:10px}
.world{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:14px;color:inherit;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.world.cur{border-color:var(--gold)}
.world-main{flex:1;min-width:0}
.world-main b{font:600 17px var(--serif)}
.world-main .muted{font-size:12px}
.world-time{text-align:right;font:700 20px var(--serif);color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.world-time small{display:block;font:400 10px var(--sans);color:var(--soft);letter-spacing:.5px}
.compare{width:100%;border-collapse:collapse;font-size:13px}
.compare th{font:600 11px var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--soft);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.compare td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
.compare td:first-child{font-weight:600;white-space:nowrap}
.compare tr.me td{color:var(--gold)}
.table-scroll{overflow-x:auto}
.routine{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.field{display:grid;gap:5px;font-size:12px;color:var(--soft)}
.field input,.field select{width:100%}
.conv .row .v b{font:700 18px var(--serif);color:var(--gold)}
.fact{font-size:13px;color:var(--soft);font-style:italic;margin-top:4px}

/* Navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card-strong);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{background:none;border:0;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:600 10.5px var(--sans);cursor:pointer;padding:0 2px}
.nav button svg{width:23px;height:23px}
.nav button[aria-current="page"]{color:var(--gold)}

/* Folhas (definições e mundos) */
dialog.sheet{border:0;padding:0;background:var(--card-strong);color:var(--ink);width:min(560px,100%);max-width:100%;max-height:88vh;margin:auto auto 0;border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
dialog.sheet::backdrop{background:rgba(2,4,10,.6)}
@media(min-width:700px){dialog.sheet{margin:auto;border-radius:20px}}
.sheet-inner{padding:20px 20px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:88vh}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.sheet-head h2{font:600 22px var(--serif);margin:0}
.sheet fieldset{border:0;padding:0;margin:18px 0 0}
.sheet legend{font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--soft);margin-bottom:9px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:8px 14px;min-height:40px;font:500 13px var(--sans);cursor:pointer}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opt .sw{width:14px;height:14px;border-radius:50%;flex:none}
.linkbtn{background:none;border:0;color:var(--soft);font:500 13px var(--sans);text-decoration:underline;cursor:pointer;padding:8px 0;margin-top:18px}

/* Modo relógio */
.clockmode{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(ellipse at 70% 20%,rgba(255,180,60,.12),transparent 55%),#02030a;text-align:center;padding:24px}
.clockmode.on{display:flex}
.clockmode .solar{font-size:min(26vw,30vh)}
.clockmode .lcd svg{height:min(13vw,14vh)}
.clockmode .cm-hint{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:12px;color:#7f89a6}
@media(orientation:landscape) and (max-height:500px){.clockmode{flex-direction:row;gap:40px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 0.6: pesquisa de locais */
.search{width:100%;font:16px var(--sans);min-height:46px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:12px;color:var(--ink);padding:10px 14px;margin:10px 0 4px}
#placeList{max-height:62vh;overflow:auto;margin-top:6px}
.place-item{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;padding:12px 4px;cursor:pointer;font:inherit}
.place-item b{display:block;font-weight:600;font-size:15px}
.place-item small{display:block;color:var(--soft);font-size:12px;margin-top:2px}
.place-item.cur b{color:var(--gold)}
.place-item.gps b{color:var(--gold)}
.place-time{font-variant-numeric:tabular-nums;color:var(--soft);font-size:13px;flex:none}
.place-head{font:600 10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--soft);margin:18px 0 2px}
/* 0.6: temperatura típica */
.temp-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.temp-top b{display:block;font:700 20px var(--serif);font-variant-numeric:lining-nums tabular-nums}
.temp-top .big b{font-size:26px;color:var(--gold)}
.temp-top span{display:block;font-size:11.5px;color:var(--soft);margin-top:3px}
.temp-chart{display:block;width:100%;height:auto;margin:10px 0 2px;overflow:visible;color:var(--ink)}
.temp-chart text{font:10px var(--sans);fill:var(--soft)}
details.card>summary .sumt{display:inline;font-size:14px;color:var(--ink);margin:0}
/* 0.7 */
.planet-dot.photo{box-shadow:none;border-radius:0;background-color:transparent}
.explore-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 0;padding:10px 12px;border-radius:14px;background:rgba(243,201,105,.16);border:1px solid var(--gold);font-size:13px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.explore-bar .btn{min-height:36px;padding:6px 12px;flex:none}
[dir="rtl"] .solar,[dir="rtl"] .lcd,[dir="rtl"] .place-time,[dir="rtl"] .events b,[dir="rtl"] .world-time,[dir="rtl"] .t-time{direction:ltr;unicode-bidi:isolate}
[dir="rtl"] .solar{text-align:right}
[dir="rtl"] .row .v{text-align:left}
[dir="rtl"] details.card>summary{padding:16px 18px 16px 44px}
[dir="rtl"] details.card>summary::after{right:auto;left:18px}
[dir="rtl"] .place-item,[dir="rtl"] .world,[dir="rtl"] .teaser{text-align:right}

<script>

// ---------- Cálculos astronómicos (sem DOM, reutilizáveis em Kotlin) ----------
const rad = Math.PI/180, deg = 180/Math.PI;
const mod = (a,b) => ((a % b) + b) % b;
const jd = ms => ms/86400000 + 2440587.5;

function sun(ms){
  const d = jd(ms) - 2451545, T = d/36525;
  const L0 = mod(280.46646 + T*(36000.76983 + 0.0003032*T), 360);
  const M = 357.52911 + T*(35999.05029 - 0.0001537*T);
  const e = 0.016708634 - T*(0.000042037 + 0.0000001267*T);
  const Mr = M*rad;
  const C = Math.sin(Mr)*(1.914602 - T*(0.004817 + 0.000014*T)) + Math.sin(2*Mr)*(0.019993 - 0.000101*T) + Math.sin(3*Mr)*0.000289;
  const omega = 125.04 - 1934.136*T;
  const lambda = L0 + C - 0.00569 - 0.00478*Math.sin(omega*rad);
  const eps0 = 23 + (26 + (21.448 - T*(46.815 + T*(0.00059 - T*0.001813)))/60)/60;
  const eps = eps0 + 0.00256*Math.cos(omega*rad);
  const dec = Math.asin(Math.sin(eps*rad)*Math.sin(lambda*rad));
  const y = Math.tan(eps*rad/2)**2, L0r = L0*rad;
  const eot = 4*deg*(y*Math.sin(2*L0r) - 2*e*Math.sin(Mr) + 4*e*y*Math.sin(Mr)*Math.cos(2*L0r) - 0.5*y*y*Math.sin(4*L0r) - 1.25*e*e*Math.sin(2*Mr));
  return {dec, eot, lambda: mod(lambda,360)};
}

// Posição do Sol + hora solar verdadeira (minutos desde a meia-noite solar)
function sunPos(ms, lat, lon){
  const s = sun(ms);
  const utcMin = mod(ms/60000, 1440);
  const tst = mod(utcMin + 4*lon + s.eot, 1440);
  const Hd = tst/4 - 180, H = Hd*rad, phi = lat*rad;
  const alt = Math.asin(Math.sin(phi)*Math.sin(s.dec) + Math.cos(phi)*Math.cos(s.dec)*Math.cos(H))*deg;
  const az = mod(Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(s.dec)*Math.cos(phi))*deg + 180, 360);
  return {alt, az, H: Hd, tst, eot: s.eot, lambda: s.lambda};
}

function moon(ms){
  const d = jd(ms) - 2451545, T = d/36525;
  const Lp = 218.3164477 + 481267.88123421*T;
  const D  = 297.8501921 + 445267.1114034*T;
  const M  = 357.5291092 + 35999.0502909*T;
  const Mp = 134.9633964 + 477198.8675055*T;
  const F  = 93.2720950 + 483202.0175233*T;
  const s = x => Math.sin(x*rad), c = x => Math.cos(x*rad);
  const lon = Lp + 6.289*s(Mp) + 1.274*s(2*D-Mp) + 0.658*s(2*D) + 0.214*s(2*Mp) - 0.186*s(M) - 0.114*s(2*F)
    + 0.059*s(2*D-2*Mp) + 0.057*s(2*D-M-Mp) + 0.053*s(2*D+Mp) + 0.046*s(2*D-M) + 0.041*s(Mp-M) - 0.035*s(D) - 0.030*s(Mp+M);
  const lat = 5.128*s(F) + 0.281*s(Mp+F) + 0.278*s(Mp-F) + 0.173*s(2*D-F) + 0.055*s(2*D-Mp+F) + 0.046*s(2*D-Mp-F) + 0.033*s(2*D+F);
  const dist = 385001 - 20905*c(Mp) - 3699*c(2*D-Mp) - 2956*c(2*D) - 570*c(2*Mp) + 246*c(2*Mp-2*D) - 205*c(M-2*D) - 171*c(Mp+2*D) - 152*c(Mp+M-2*D);
  const eps = (23.4393 - 3.563e-7*d)*rad, l = lon*rad, b = lat*rad;
  const ra = Math.atan2(Math.sin(l)*Math.cos(eps) - Math.tan(b)*Math.sin(eps), Math.cos(l));
  const dec = Math.asin(Math.sin(b)*Math.cos(eps) + Math.cos(b)*Math.sin(eps)*Math.sin(l));
  const i = 180 - D - 6.289*s(Mp) + 2.100*s(M) - 1.274*s(2*D-Mp) - 0.658*s(2*D) - 0.214*s(2*Mp) - 0.110*s(D);
  return {lon: mod(lon,360), ra, dec, dist, illum: (1 + c(i))/2, par: Math.asin(6378.14/dist)*deg, d, T};
}

function moonPos(ms, lat, lon){
  const m = moon(ms);
  const gmst = mod(280.46061837 + 360.98564736629*m.d + 0.000387933*m.T*m.T, 360);
  const H = (gmst + lon)*rad - m.ra, phi = lat*rad;
  const alt = Math.asin(Math.sin(phi)*Math.sin(m.dec) + Math.cos(phi)*Math.cos(m.dec)*Math.cos(H))*deg;
  const az = mod(Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi) - Math.tan(m.dec)*Math.cos(phi))*deg + 180, 360);
  return {alt, az, h0: 0.7275*m.par - 0.5667, m};
}

const elongation = ms => mod(moon(ms).lon - sun(ms).lambda, 360);

function refine(f, a, b){
  let fa = f(a);
  for (let i = 0; i < 24; i++){
    const mid = (a+b)/2, fm = f(mid);
    if ((fm < 0) === (fa < 0)) { a = mid; fa = fm; } else b = mid;
  }
  return (a+b)/2;
}

// Todos os eventos de um dia local [start, end)
function computeDay(lat, lon, start, end){
  const step = 5*60000, samples = [];
  for (let t = start; t <= end; t += step){
    const mp = moonPos(t, lat, lon);
    samples.push({t, sun: sunPos(t, lat, lon).alt, moon: mp.alt, mh: mp.alt - mp.h0});
  }
  const sunF = level => t => sunPos(t, lat, lon).alt - level;
  function cross(get, fn){
    const out = [];
    for (let i = 1; i < samples.length; i++){
      const va = get(samples[i-1]), vb = get(samples[i]);
      if (va < 0 && vb >= 0) out.push({t: refine(fn, samples[i-1].t, samples[i].t), up: true});
      else if (va >= 0 && vb < 0) out.push({t: refine(fn, samples[i-1].t, samples[i].t), up: false});
    }
    return out;
  }
  const ev = {};
  for (const L of [-18, -12, -6, -4, -0.833, 6]){
    const c = cross(s => s.sun - L, sunF(L));
    const up = c.find(x => x.up), dn = c.find(x => !x.up);
    ev[L] = {up: up ? up.t : null, dn: dn ? dn.t : null};
  }
  const mc = cross(s => s.mh, t => { const r = moonPos(t, lat, lon); return r.alt - r.h0; });
  const mUp = mc.find(x => x.up), mDn = mc.find(x => !x.up);
  let noon = start + 12*3600000;
  for (let i = 0; i < 4; i++) noon -= sunPos(noon, lat, lon).H*4*60000;
  const rise = ev[-0.833].up, set = ev[-0.833].dn;
  let dayLen;
  if (rise !== null && set !== null && set > rise) dayLen = set - rise;

  if (eotYear !== p.y){ eotPts = []; for (let i = 0; i < 365; i++) eotPts.push(sun(Date.UTC(p.y, 0, 1+i, 12)).eot); eotYear = p.y; }
  const W = 340, mid = 62, k = 3.1, X = i => 8 + i/364*(W-16);
  const doy = Math.floor((viewMs - Date.UTC(p.y,0,1))/86400000), mx = X(Math.max(0, Math.min(364, doy))), my = mid - sp.eot*k;
  let ml = ''; t('months').split(' ').forEach((mm, i) => { const d = (Date.UTC(p.y,i,15) - Date.UTC(p.y,0,1))/86400000; ml += `<text x="${X(d).toFixed(1)}" y="134" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">${mm}</text>`; });
  $('eot').innerHTML = `<line x1="8" x2="${W-8}" y1="${mid}" y2="${mid}" stroke="currentColor" stroke-opacity=".3"/><text x="${W-8}" y="${mid-12*k}" text-anchor="end" font-size="10" fill="currentColor" opacity=".65">${t('sunFast')}</text><text x="${W-8}" y="${mid+12*k+8}" text-anchor="end" font-size="10" fill="currentColor" opacity=".65">${t('sunSlow')}</text>
    <path d="${eotPts.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${(mid - v*k).toFixed(1)}`).join('')}" fill="none" stroke="#f3b64a" stroke-width="2.2"/><circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="5.5" fill="#ffd76a" stroke="#8a5a0e"/>${ml}`;
  $('eotLede').textContent = t('eotLede', {v: nf1.format(Math.abs(sp.eot)), s: t(sp.eot >= 0 ? 'ahead' : 'behind')});
}

// ---------- Hoje: outro mundo ----------
function renderWorldHero(){
  const w = world, ws = worldSun(w, viewMs), rs = worldRiseSet(w.lat, ws.dec), hourSec = w.sol/24;
  $('worldTitle').textContent = pname(w.k); $('worldSite').textContent = wsite(w);
  $('solarLabel').textContent = t('solarLabelWorld', {w: pname(w.k)});
  $('solar').innerHTML = solarHTML(ws.lst);
  $('sentence').innerHTML = t('wDaySentence', {d: durS(w.sol)}) + (w.mars24 ? t('wSolSentence', {n: nf0.format(ws.sol)}) : '');
  const pts = []; for (let h = 0; h <= 24.001; h += .1) pts.push([30 + h/24*540, yAlt(worldAlt(w.lat, ws.dec, h))]);
  let ticks = ''; for (let h = 0; h <= 24; h += 6) ticks += `<text x="${(30 + h/24*540).toFixed(1)}" y="270" text-anchor="middle">${pad(h)}:00</text>`;
  const alt = worldAlt(w.lat, ws.dec, ws.lst);
  $('sunArc').innerHTML = arcSVG(pts, [30 + ws.lst/24*540, yAlt(alt)], ticks, 'wa'); $('sunArc').style.color = 'var(--ink)';
  $('arcTitle').textContent = t('arcTitleWorld', {w: pname(w.k)}); $('arcSub').textContent = t('arcSubWorld', {h: durS(hourSec)});
  $('sunState').textContent = alt > 0 ? t('sunUp') : t('sunDown');
  $('noonTime').textContent = '12:00';
  $('riseTime').textContent = rs.polar ? t(rs.polar === 'dia' ? 'alwaysDay' : 'alwaysNight') : hhmm(rs.rise);
  $('setTime').textContent = rs.polar ? '—' : hhmm(rs.set);
  let st = `<div class="stat"><b>${rs.polar ? (rs.polar === 'dia' ? '24 h' : '0 h') : durMin(rs.len*60)}</b><span>${t('wDaylight')}</span></div>`;
  if (!rs.polar) st += alt > 0 ? `<div class="stat"><b>${durS(mod(rs.set - ws.lst, 24)*hourSec)}</b><span>${t('wToSet')}</span></div>` : `<div class="stat"><b>${durS(mod(rs.rise - ws.lst, 24)*hourSec)}</b><span>${t('wToRise')}</span></div>`;
  st += `<div class="stat"><b>${durS(hourSec)}</b><span>${t('wHour')}</span></div>`;
  $('stats').innerHTML = st;
  let rows = row(t('wDayLen'), durS(w.sol)) + row(t('wYear'), t('wYearVal', {d: nf0.format(w.ano)}) + (w.ano > 1000 ? t('wYears', {y: nf1.format(w.ano/365.25)}) : '')) +
    row(t('wDaysYear'), perYear(w)) + row(t('wSunAlt'), `${nf0.format(alt)}°`) + row(t('wLat'), `${nf1.format(Math.abs(w.lat))}° ${w.lat >= 0 ? 'N' : 'S'}`);
  if (w.mars24) rows += row(t('wSeason'), `${tl('seasons', Math.floor(ws.Ls/90))} (Ls ${nf0.format(ws.Ls)}°)`);
  $('worldRows').innerHTML = rows; $('worldFact').textContent = wfact(w);
}

// ---------- Ciclo principal ----------
function render(){
  if (live) viewMs = Date.now();
  const tz = loc.tz, p = localParts(tz, viewMs), key = `${loc.id}|${loc.lat}|${p.y}-${p.m}-${p.d}`;
  if (key !== dayKey){
    const start = localMidnight(tz, p.y, p.m, p.d), end = localMidnight(tz, p.y, p.m, p.d + 1);
    day = computeDay(loc.lat, loc.lon, start, end);
    yLen = dayLengthOnly(loc.lat, loc.lon, localMidnight(tz, p.y, p.m, p.d - 1), start);
    dayKey = key;
  }
  const sp = sunPos(viewMs, loc.lat, loc.lon);
  document.body.dataset.sky = skyFor(sp.alt);
  $('sunGlow').style.opacity = sp.alt > 0 ? 1 : sp.alt > -12 ? .55 : .28;
  const secs = prefs.seconds !== 'off', lcdHTML = sevenSeg(pad(p.h), pad(p.mi), secs ? pad(p.s) : undefined);
  $('lcd').innerHTML = lcdHTML; $('lcdPlace').textContent = world ? t('legalEarth', {p: placeName(loc)}) : placeName(loc);
  $('earthHead').hidden = !!world; $('worldHead').hidden = !world; $('backEarthBtn').hidden = !world;
  $('earthDetails').hidden = !!world; $('worldDetails').hidden = !world; $('marsTeaserCard').hidden = !!world; $('tempCard').hidden = !!world;
  $('worldBtn').classList.toggle('active', !!world);
  if (world) renderWorldHero(); else renderEarthHero(sp, p);
  fitClock();
  $('status').classList.toggle('paused', !live); $('statusText').textContent = live ? t('live') : t('exploring');
  $('exploreBar').hidden = live; if (!live) $('exploreText').textContent = t('exploreBanner', {t: shortDT(viewMs, loc.tz)});
  if (document.activeElement !== $('timeInput')) $('timeInput').value = pad(p.h) + ':' + pad(p.mi);
  if (document.activeElement !== $('dateInput')) $('dateInput').value = `${p.y}-${pad(p.m)}-${pad(p.d)}`;
  if (document.activeElement !== $('slider') || live) $('slider').value = p.h*60 + p.mi;
  const sk = `${view}|${key}|${Math.floor(viewMs/60000)}|${world ? world.k : ''}|${LANG}`;
  if (sk !== slowKey){ slowKey = sk;
    if (view === 'planetas') renderPlanets(); if (view === 'ceu') renderSky(); if (view === 'sistema') renderSystem(); if (view === 'mundos') renderMundos();
  } else if (view === 'mundos') $('worldCards').innerHTML = worldCardsHTML();
  if ($('worldSheet').open) $('worldPicker').innerHTML = worldCardsHTML();
  if ($('clockMode').classList.contains('on')){
    $('cmSolar').innerHTML = $('solar').innerHTML; $('cmLcd').innerHTML = lcdHTML;
    $('cmLabel').textContent = $('solarLabel').textContent; $('cmLcdLabel').textContent = `${t('legal')} · ${placeName(loc)}`;
  }
}

// ---------- Pesquisa de locais ----------
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function placeItem(p){
  const now = hm(Date.now(), p.tz);
  return `<button type="button" class="place-item${p.id === loc.id ? ' cur' : ''}" data-place="${p.id}"><span><b>${placeName(p)}</b><small>${p.region ? p.region + ' · ' : ''}${countryName(p)}${p.capital ? ' · ' + t('capital') : ''}</small></span><span class="place-time">${now}</span></button>`;
}
function renderPlaceList(){
  const q = norm($('placeSearch').value.trim());
  let html = '';
  if (!q){
    html += `<button type="button" class="place-item gps" data-place="gps"><span><b>📍 ${t('myLocation')}</b></span></button>`;
    const rec = prefs.recent.map(id => PLACES.find(p => p.id === id)).filter(Boolean);
    if (rec.length) html += `<div class="place-head">${t('recent')}</div>` + rec.map(placeItem).join('');
    html += `<div class="place-head">${t('allPlaces')}</div>`;
  }
  const list = PLACES.filter(p => !q || norm(p.names.pt).includes(q) || norm(p.names.en).includes(q) || norm(countryName(p)).includes(q) || (p.region && norm(p.region).includes(q)))
    .map(p => { const n = norm(placeName(p)), o = norm(p.names.pt) + ' ' + norm(p.names.en); return [p, !q ? 0 : n.startsWith(q) ? 0 : o.split(/[\s-]/).some(w => w.startsWith(q)) ? 1 : o.includes(q) ? 2 : 3]; })
    .sort((a, b) => a[1] - b[1] || placeName(a[0]).localeCompare(placeName(b[0]), t('locale'))).map(x => x[0]);
  html += list.length ? list.map(placeItem).join('') : `<p class="muted">${t('noResults')}</p>`;
  $('placeList').innerHTML = html;
}
function choosePlace(p){
  loc = p; dayKey = null;
  if (p.id !== 'gps'){ prefs.place = p.id; prefs.recent = [p.id, ...prefs.recent.filter(x => x !== p.id)].slice(0, 5); savePrefs(); }
  buildDial(); render();
}
$('locBtn').addEventListener('click', () => { $('placeSearch').value = ''; renderPlaceList(); $('placeSheet').showModal(); $('placeList').scrollTop = 0; setTimeout(() => $('placeSearch').focus(), 60); });
['input', 'keyup', 'compositionend', 'search'].forEach(ev => $('placeSearch').addEventListener(ev, e => { if (!(ev === 'keyup' && e.key === 'Enter')) renderPlaceList(); }));
// Tecla de pesquisa/Enter do teclado: escolhe o primeiro local encontrado
$('placeSearch').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault(); renderPlaceList();
  const first = $('placeList').querySelector('[data-place]:not([data-place="gps"])');
  if (first && $('placeSearch').value.trim()) first.click(); else $('placeSearch').blur();
});
$('placeList').addEventListener('click', e => {
  const b = e.target.closest('[data-place]'); if (!b) return;
  const note = $('note');
  if (b.dataset.place === 'gps'){
    $('placeSheet').close();
    if (!navigator.geolocation){ note.textContent = t('noGeo'); note.hidden = false; return; }
    note.textContent = t('gettingLoc'); note.hidden = false;
    navigator.geolocation.getCurrentPosition(pos => {
      note.hidden = true;
      choosePlace({id:'gps', cc:'', names:{pt:t('here'), en:t('here')}, lat: pos.coords.latitude, lon: pos.coords.longitude, tz: Intl.DateTimeFormat().resolvedOptions().timeZone, normals: null});
    }, () => { note.textContent = t('locFail'); }, {timeout: 10000});
    return;
  }
  $('placeSheet').close(); note.hidden = true;
  choosePlace(PLACES.find(p => p.id === b.dataset.place));
});

// ---------- Definições ----------
function optionsDef(){
  return {
    lang: {label: t('optLang'), opts: [['auto', t('langAuto')], ...LANGS]},
    theme: {label: t('optTheme'), opts: [['espaco', t('optSpace'), 'radial-gradient(circle at 60% 40%,#f3c969 0 18%,#1b2350 30%,#03050c)'], ['claro', t('optLight'), 'linear-gradient(135deg,#eef2f8 50%,#b7791f 50%)']]},
    lcd: {label: t('optLcd'), opts: [['vermelho','#ff3b30'],['ambar','#ffb300'],['verde','#3dff8f'],['azul','#4fc8ff']].map(([v, c], i) => [v, tl('lcdNames', i), c])},
    size: {label: t('optSize'), opts: ['normal','grande','enorme'].map((v, i) => [v, tl('sizes', i)])},
    seconds: {label: t('optSecs'), opts: [['on', t('show')], ['off', t('hide')]]},
    dial: {label: t('optDial'), opts: ['nenhum','sundial','h24'].map((v, i) => [v, tl('dials', i)])},
    numerals: {label: t('optNum'), opts: ['roman','arabic'].map((v, i) => [v, tl('nums', i)])}
  };
}
function buildSettings(){
  $('settingsBody').innerHTML = Object.entries(optionsDef()).map(([k, o]) => `<fieldset><legend>${o.label}</legend><div class="opts">${o.opts.map(([v, l, sw]) => `<button type="button" class="opt" data-k="${k}" data-v="${v}" aria-pressed="${prefs[k] === v}">${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${l}</button>`).join('')}</div></fieldset>`).join('');
}
function applyPrefs(){
  setLang();
  document.body.dataset.theme = prefs.theme; document.body.dataset.lcd = prefs.lcd;
  document.documentElement.style.setProperty('--clock-scale', SCALE[prefs.size] || 1);
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = prefs.theme === 'claro' ? '#e9eef6' : '#03050c';
  buildSettings(); buildRoutineInputs(); buildDial(); placeVisual(); slowKey = null; render();
}
$('settingsBody').addEventListener('click', e => { const b = e.target.closest('.opt'); if (!b) return; prefs[b.dataset.k] = b.dataset.v; savePrefs(); applyPrefs(); });

// ---------- Eventos ----------
function wallTime(tz, y, m, d, minutes){
  const start = localMidnight(tz, y, m, d), end = localMidnight(tz, y, m, d + 1), matches = []; let next = null;
  for (let x = start; x < end; x += 60000){ const q = localParts(tz, x), n = q.h*60 + q.mi; if (n === minutes) matches.push(x); if (n > minutes && next === null) next = x; }
  $('timeNote').textContent = matches.length > 1 ? t('noteTwice') : !matches.length ? t('noteGap') : '';
  return matches[0] ?? next ?? end - 60000;
}
$('slider').addEventListener('input', e => { const p = localParts(loc.tz, viewMs); live = false; viewMs = wallTime(loc.tz, p.y, p.m, p.d, +e.target.value); render(); });
$('dateInput').addEventListener('change', e => { if (!e.target.value) return; const [y, m, d] = e.target.value.split('-').map(Number), p = localParts(loc.tz, viewMs); live = false; viewMs = wallTime(loc.tz, y, m, d, p.h*60 + p.mi); render(); });
$('timeInput').addEventListener('change', e => { if (!e.target.value) return; const [h, m] = e.target.value.split(':').map(Number), p = localParts(loc.tz, viewMs); live = false; viewMs = wallTime(loc.tz, p.y, p.m, p.d, h*60 + m); render(); });
function goLive(){ live = true; $('timeNote').textContent = ''; render(); }
$('nowBtn').addEventListener('click', goLive);
$('exploreNow').addEventListener('click', goLive);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !live) goLive(); });
$('routineWorld').addEventListener('change', e => { prefs.routineWorld = e.target.value; savePrefs(); renderRoutine(); });
$('routineInputs').addEventListener('change', e => { const i = e.target.dataset.i; if (i === undefined || !e.target.value) return; prefs.routine[+i] = e.target.value; savePrefs(); renderRoutine(); });
document.querySelectorAll('.nav button').forEach(b => b.addEventListener('click', () => {
  view = b.dataset.view;
  document.querySelectorAll('.nav button').forEach(x => x === b ? x.setAttribute('aria-current', 'page') : x.removeAttribute('aria-current'));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'view-' + view));
  scrollTo({top: 0}); slowKey = null; render();
}));
function goView(v){ document.querySelector(`.nav button[data-view="${v}"]`).click(); }
$('worldBtn').addEventListener('click', () => { $('worldPicker').innerHTML = worldCardsHTML(); $('worldSheet').showModal(); });
$('settingsBtn').addEventListener('click', () => $('settings').showModal());
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); }));
$('worldPicker').addEventListener('click', e => { const b = e.target.closest('[data-world]'); if (!b) return; $('worldSheet').close(); setWorld(b.dataset.world); goView('hoje'); });
$('worldCards').addEventListener('click', e => { const b = e.target.closest('[data-world]'); if (!b) return; setWorld(b.dataset.world); goView('hoje'); });
$('marsTeaser').addEventListener('click', () => setWorld('marte'));
$('backEarthBtn').addEventListener('click', () => setWorld('terra'));
$('brand').addEventListener('click', e => { e.preventDefault(); setWorld('terra'); goView('hoje'); });
$('settingsReset').addEventListener('click', () => { const keep = {place: prefs.place, recent: prefs.recent}; prefs = {...DEFAULTS, ...keep, routine: [...DEFAULTS.routine]}; savePrefs(); applyPrefs(); });
let wakeLock = null;
$('clockModeBtn').addEventListener('click', async () => { $('clockMode').classList.add('on'); render(); try { await document.documentElement.requestFullscreen?.(); } catch (e) {} try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {} });
$('clockMode').addEventListener('click', async () => { $('clockMode').classList.remove('on'); try { if (document.fullscreenElement) await document.exitFullscreen(); } catch (e) {} try { await wakeLock?.release(); } catch (e) {} wakeLock = null; });

// ---------- Arranque ----------
$('moonImg').src = PIMG.lua; $('marsDot').style.background = photoCSS('marte');
drawSpace(); applyPrefs();
setInterval(() => { if (live) render(); }, 1000);
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {}));
</script>
